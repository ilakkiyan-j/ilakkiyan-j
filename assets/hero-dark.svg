<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Dark Background Gradients -->
    <linearGradient id="bgGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080d"/>
      <stop offset="50%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#0f1422"/>
    </linearGradient>

    <linearGradient id="magentaGlowDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B24392" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#B24392" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="cyanGlowDark" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="textGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <linearGradient id="borderGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.16)"/>
      <stop offset="50%" stop-color="rgba(178, 67, 146, 0.45)"/>
      <stop offset="100%" stop-color="rgba(0, 240, 255, 0.25)"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="gridDark" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
      <circle cx="40" cy="0" r="1" fill="rgba(255, 255, 255, 0.08)"/>
      <circle cx="0" cy="40" r="1" fill="rgba(255, 255, 255, 0.08)"/>
    </pattern>

    <filter id="blurDark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <style>
    .title-text-dark {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
    .mono-dark {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', Courier, monospace;
      font-weight: 500;
    }
    .pulse-dot-dark {
      animation: pulseDark 2s infinite;
    }
    @keyframes pulseDark {
      0% { opacity: 0.4; r: 4px; }
      50% { opacity: 1; r: 5px; }
      100% { opacity: 0.4; r: 4px; }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradientDark)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="100" r="180" fill="url(#magentaGlowDark)" filter="url(#blurDark)"/>
  <circle cx="1000" cy="240" r="160" fill="url(#cyanGlowDark)" filter="url(#blurDark)"/>

  <!-- Grid -->
  <rect width="1200" height="360" rx="16" fill="url(#gridDark)"/>

  <!-- Outer Glass Frame -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="url(#borderGradDark)" stroke-width="1.5"/>

  <!-- Top Status Bar & Window Controls -->
  <g transform="translate(48, 36)">
    <!-- Terminal Dots -->
    <circle cx="0" cy="0" r="5" fill="#ff5f56"/>
    <circle cx="16" cy="0" r="5" fill="#ffbd2e"/>
    <circle cx="32" cy="0" r="5" fill="#27c93f"/>

    <!-- Status Badge -->
    <g transform="translate(68, -12)">
      <rect width="260" height="24" rx="12" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1"/>
      <circle cx="14" cy="12" r="4.5" fill="#10b981" class="pulse-dot-dark"/>
      <text x="26" y="16" fill="#10b981" font-size="11" class="mono-dark" letter-spacing="0.5">SYSTEM ACTIVE · OPEN TO COLLAB</text>
    </g>

    <!-- Right Side System Telemetry -->
    <g transform="translate(940, -12)">
      <rect width="160" height="24" rx="12" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="80" y="16" text-anchor="middle" fill="#94a3b8" font-size="11" class="mono-dark">NODE: PROD_v2.6</text>
    </g>
  </g>

  <!-- Hero Content Center -->
  <g transform="translate(48, 130)">
    <!-- Role Subtitle Overline -->
    <g transform="translate(0, 0)">
      <text x="0" y="0" fill="#e066bc" font-size="13" class="mono-dark" letter-spacing="2">01 // AI PRODUCT ENGINEER</text>
      <line x1="210" y1="-4" x2="320" y2="-4" stroke="rgba(178, 67, 146, 0.4)" stroke-width="1"/>
    </g>

    <!-- Main Name Title -->
    <text x="0" y="52" fill="url(#textGradDark)" font-size="46" class="title-text-dark">
      ILAKKIYAN J
    </text>

    <!-- Catchphrase / Architectural Philosophy -->
    <text x="0" y="88" fill="#94a3b8" font-size="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="400">
      Building AI products end-to-end — from <tspan fill="#ffffff" font-weight="600">Bedrock &amp; local LLMs</tspan> to <tspan fill="#ffffff" font-weight="600">scalable AWS backends</tspan> &amp; <tspan fill="#ffffff" font-weight="600">shipped interfaces</tspan>.
    </text>
  </g>

  <!-- Bottom Telemetry Chips -->
  <g transform="translate(48, 282)">
    <!-- Chip 1: Bedrock & Local AI -->
    <g transform="translate(0, 0)">
      <rect width="210" height="34" rx="8" fill="rgba(178, 67, 146, 0.12)" stroke="rgba(178, 67, 146, 0.45)" stroke-width="1"/>
      <text x="14" y="21" fill="#e066bc" font-size="12" class="mono-dark">☁️ Bedrock · Ollama · RAG</text>
    </g>

    <!-- Chip 2: Agentic Workflows -->
    <g transform="translate(224, 0)">
      <rect width="210" height="34" rx="8" fill="rgba(0, 240, 255, 0.08)" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1"/>
      <text x="14" y="21" fill="#00f0ff" font-size="12" class="mono-dark">⚡ Agentic Workflows</text>
    </g>

    <!-- Chip 3: AWS & Type-Safe APIs -->
    <g transform="translate(448, 0)">
      <rect width="210" height="34" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
      <text x="14" y="21" fill="#e2e8f0" font-size="12" class="mono-dark">🚀 AWS &amp; Type-Safe APIs</text>
    </g>

    <!-- Chip 4: DynamoDB & Postgres -->
    <g transform="translate(672, 0)">
      <rect width="210" height="34" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
      <text x="14" y="21" fill="#e2e8f0" font-size="12" class="mono-dark">🗄️ DynamoDB &amp; Postgres</text>
    </g>

    <!-- Chip 5: Location / Spec -->
    <g transform="translate(896, 0)">
      <rect width="206" height="34" rx="8" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="14" y="21" fill="#94a3b8" font-size="12" class="mono-dark">📍 Tamil Nadu, India</text>
    </g>
  </g>
</svg>
